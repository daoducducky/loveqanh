<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Đến Quỳnh Anh 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=9.0">
  <link rel="stylesheet" href="./assets/css/permission-gate.css">
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<!-- partial:index.partial.html -->
<canvas id="heart"></canvas>
<canvas id="fireworks-canvas"></canvas>

  <!-- Floating Love Letter & Counter Card -->
  <div class="love-card glass-panel" id="love-card">
    <div class="love-card-header">
      <div class="avatar-couple">
        <img src="./assets/images/avatar.png" alt="Anh Đức" id="couple-avatar-user">
        <div class="heart-pulse-icon-wrapper">
          <svg class="heart-pulse-icon" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <img src="./assets/images/manh.png" alt="Quỳnh Anh" id="couple-avatar-gf">
      </div>
      <button class="close-card-btn" id="close-card-btn" aria-label="Minimize">
        <i data-lucide="minus"></i>
      </button>
    </div>
    
    <div class="love-card-body">
      <div class="love-letter">
        <span id="typewriter-text"></span>
        <span class="cursor">|</span>
      </div>
    </div>
  </div>

<!-- Âm thanh nền gốc và nhạc lời chúc -->
<audio id="bg-music" src="./maianh.mp3" autoplay loop></audio>
<audio id="wish-music" src="./loichuc.mp3"></audio>
<!-- partial -->
  <script src="./assets/js/config.js?v=3.0"></script>
  <script src="./script.js?v=3.0"></script>
  <script src="./assets/js/permission-gate.js?v=3.0"></script>
</body>
</html>
